<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Contact Yagnik J Donda</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #ffffff;
      color: #222222;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4.5rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .contact-label {
      margin: 0 0 0.4rem;
      color: #666666;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <p class="contact-label">Contact</p>
    <h1>Yagnik J Donda</h1>
  </main>
</body>
</html>
